operator:
  # Sync period controls how often the operator reconciles resources.
  syncPeriod: 1m

  # Restrict to namespaces where CRs are deployed; avoids cluster-wide RBAC.
  watchedNamespaces:
    - tfc-agents

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Pin the operator to system nodes so agent nodes remain available for workloads.
nodeSelector:
  node-pool: system

tolerations:
  - key: node-role
    operator: Equal
    value: system
    effect: NoSchedule
