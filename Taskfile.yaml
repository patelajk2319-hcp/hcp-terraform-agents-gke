version: "3"

dotenv:
  - .env

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  # ── Auth ──────────────────────────────────────────────────────────────────

  login:
    desc: Authenticate with GCP and set application default credentials
    cmds:
      - gcloud auth login
      - gcloud config set project {{.GCP_PROJECT_ID}}
      - gcloud auth application-default login

  # ── Deployment ────────────────────────────────────────────────────────────

  deploy:gke:
    desc: Deploy the GKE cluster
    cmds:
      - bash scripts/10_deploy_gke.sh

  deploy:operator:
    desc: Deploy the HCP Terraform Operator onto the GKE cluster
    deps: [deploy:gke]
    cmds:
      - bash scripts/20_deploy_operator.sh

  deploy:agents:
    desc: Deploy HCP Terraform Agent Pools
    deps: [deploy:operator]
    cmds:
      - bash scripts/30_deploy_agent_pools.sh

  deploy:all:
    desc: Deploy everything in order (GKE → Operator → Agents)
    cmds:
      - task: deploy:gke
      - task: deploy:operator
      - task: deploy:agents

  # ── Verification ──────────────────────────────────────────────────────────

  verify:
    desc: Verify the deployment health
    cmds:
      - bash scripts/40_verify.sh

  # ── Teardown ──────────────────────────────────────────────────────────────

  destroy:
    desc: Destroy all resources
    aliases: [clean]
    cmds:
      - bash scripts/99_destroy.sh
